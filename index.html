<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Chris & Nas - Home</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-y: auto;
        background: linear-gradient(135deg, #f06, #aaf);
        color: #fff;
        text-align: center;
      }

      h1 {
        font-size: 4rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: #ffffff;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        animation: glow 1.5s infinite alternate;
      }

      @keyframes glow {
        0% {
          text-shadow: 0 0 5px rgba(255, 255, 255, 0.9);
        }
        100% {
          text-shadow: 0 0 15px rgba(255, 255, 255, 1);
        }
      }

      p {
        font-size: 1.2rem;
        margin: 0.5rem 0;
        text-align: center;
        opacity: 0.9;
        max-width: 600px;
      }

      button {
        padding: 1rem 2rem;
        font-size: 1.2rem;
        font-weight: 500;
        color: #fff;
        background-color: #ff6b6b;
        border: none;
        border-radius: 50px;
        margin-top: 2rem;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
      }

      button:hover {
        background-color: #ff4757;
        box-shadow: 0 5px 15px rgba(255, 107, 107, 0.5);
      }

      button:focus {
        outline: none;
      }

      footer {
        margin-top: 2rem;
        font-size: 0.9rem;
        color: #eee;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background-color: #fff;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        text-align: center;
        width: 300px;
      }

      .modal-content img {
        width: 100%;
        border-radius: 10px;
        margin-top: 10px;
      }

      .close {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Christopher Dobey and Nastassja Losada</h1>
    </header>

    <main>
      <p>Welcome to our GitHub Pages profile!</p>
      <p>
        Here, you'll find information about our work, projects, and other
        updates.
      </p>

      <button id="confetti-btn">Celebrate!</button>
      <button id="qr-btn">Click here</button>
    </main>

    <div id="qr-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <p>Scan the QR code to help fund our house!</p>
        <img src="images/revolut.jpeg" alt="Revolut QR Code" />
      </div>
    </div>

    <footer>
      <p>&copy; 2024 Chris & Nas</p>
    </footer>

    <script>
      const modal = document.getElementById("qr-modal");
      const btn = document.getElementById("qr-btn");
      const span = document.getElementsByClassName("close")[0];
      const confettiBtn = document.getElementById("confetti-btn");

      btn.onclick = function () {
        modal.style.display = "flex";
      };

      span.onclick = function () {
        modal.style.display = "none";
      };

      window.onclick = function (event) {
        if (event.target === modal) {
          modal.style.display = "none";
        }
      };

      confettiBtn.addEventListener("click", () => {
        for (let i = 0; i < 100; i++) {
          createConfetti();
        }
      });

      function createConfetti() {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        document.body.appendChild(confetti);

        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        const delay = Math.random() * 0.5;

        confetti.style.left = `${x}px`;
        confetti.style.top = `${y}px`;
        confetti.style.animationDelay = `${delay}s`;

        setTimeout(() => {
          confetti.remove();
        }, 3000);
      }
    </script>
  </body>
</html>
